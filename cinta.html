<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusus Buat Kamu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            background-color: #0d0417;
            color: #ffffff;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            /* Scroll dikunci di awal, dibuka setelah masuk portal */
            overflow-y: hidden; 
        }

        /* --- STAGE 1: INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2a083b 0%, #0d0417 100%);
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .btn-love {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2e93, #ff758c);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 46, 147, 0.7), 0 0 50px rgba(255, 117, 140, 0.5);
            animation: pulseLove 1.8s infinite ease-in-out;
            transition: transform 0.3s;
            outline: none;
        }

        .btn-love:hover {
            transform: scale(1.1);
        }

        @keyframes pulseLove {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- STAGE 2: ANIMASI PORTAL TRANSISI --- */
        #portal-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #ff2e93 0%, #7e22ce 50%, #0d0417 100%);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .portal-active {
            opacity: 1 !important;
            transform: scale(3) !important;
        }

        /* --- STAGE 3: MAIN LOVE SCENE --- */
        #main-screen {
            position: relative;
            width: 100%;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 80px 20px;
        }

        #main-screen.visible {
            opacity: 1;
        }

        /* CANVAS BACKGROUND LOVE */
        canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* KARTU SAMBUTAN UTAMA */
        .love-card {
            position: relative;
            z-index: 5;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 117, 140, 0.4);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 46, 147, 0.2);
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .love-card h1 {
            font-family: 'Sacramento', cursive;
            font-size: 52px;
            color: #ff758c;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
        }

        .love-card p {
            font-size: 15px;
            color: #f1f5f9;
            line-height: 1.8;
        }

        /* SECTION GALERI FOTO KENANGAN */
        .gallery-title {
            position: relative;
            z-index: 5;
            font-size: 22px;
            font-weight: 600;
            color: #ff758c;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        .gallery-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
            max-width: 420px;
            align-items: center;
        }

        /* BINGKAI POLAROID FOTO */
        .polaroid-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 15px 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 46, 147, 0.2);
            width: 100%;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .polaroid-card:nth-child(even) {
            transform: rotate(2deg);
        }

        .polaroid-card:hover {
            transform: scale(1.03) rotate(0deg);
        }

        .polaroid-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
        }

        .polaroid-caption {
            font-family: 'Sacramento', cursive;
            font-size: 28px;
            color: #333333;
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
        }

        /* TOMBOL MUSIK FLOATING */
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99;
            background: rgba(255, 46, 147, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 46, 147, 0.5);
            display: none; /* Muncul setelah masuk */
        }
    </style>
</head>
<body>

    <!-- LAGU SAILOR SONG (AUDIO) -->
    <!-- Kamu bisa ganti src di bawah ini dengan file sailor-song.mp3 milikmu nanti -->
    <audio id="bg-music" loop src="https://files.catbox.moe/k3b02r.mp3"></audio>

    <!-- TOMBOL MUSIK PLAY/PAUSE -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

    <!-- STAGE 1: INTRO -->
    <div id="intro-screen">
        <button class="btn-love" onclick="enterPortal()">Pencet ini sayang 💖</button>
    </div>

    <!-- STAGE 2: ANIMASI PORTAL -->
    <div id="portal-overlay"></div>

    <!-- STAGE 3: TAMPILAN UTAMA -->
    <div id="main-screen">
        <canvas id="heartCanvas"></canvas>
        
        <!-- KARTU UCAPAN -->
        <div class="love-card">
            <span>💖✨</span>
            <h1>I Love You So Much</h1>
            <p>
                Terima kasih ya sudah hadir dan mewarnai hari-hariku.<br>
                Setiap momen sama kamu selalu jadi hal terfavorit buat aku! 💕
            </p>
        </div>

        <div class="gallery-title">📜 Kenangan Indah Kita 📜</div>

        <!-- GALERI FOTO KENANGAN (BISA DI-SCROLL) -->
        <div class="gallery-container">
            
            <!-- FOTO 1 -->
            <div class="polaroid-card">
                <!-- Ganti src="foto1.jpg" nanti saat foto kamu sudah siap -->
                <img src="https://picsum.photos/400/500?random=1" alt="Foto 1">
                <div class="polaroid-caption">Momen Pertama Kita 🌸</div>
            </div>

            <!-- FOTO 2 -->
            <div class="polaroid-card">
                <!-- Ganti src="foto2.jpg" nanti -->
                <img src="https://picsum.photos/400/500?random=2" alt="Foto 2">
                <div class="polaroid-caption">Senyuman Favoritku 😊</div>
            </div>

            <!-- FOTO 3 -->
            <div class="polaroid-card">
                <!-- Ganti src="foto3.jpg" nanti -->
                <img src="https://picsum.photos/400/500?random=3" alt="Foto 3">
                <div class="polaroid-caption">Jalan-jalan Bareng 💕</div>
            </div>

            <!-- FOTO 4 -->
            <div class="polaroid-card">
                <!-- Ganti src="foto4.jpg" nanti -->
                <img src="https://picsum.photos/400/500?random=4" alt="Foto 4">
                <div class="polaroid-caption">Selalu Sama Kamu Selamanya 🔒</div>
            </div>

        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');

        // FUNGSI MASUK PORTAL & PUTAR MUSIK
        function enterPortal() {
            const introScreen = document.getElementById('intro-screen');
            const portal = document.getElementById('portal-overlay');
            const mainScreen = document.getElementById('main-screen');

            // 1. Putar Musik Sailor Song
            bgMusic.play().then(() => {
                musicBtn.style.display = 'flex';
            }).catch(err => console.log("Audio play error:", err));

            // 2. Jalankan Animasi Portal Transisi
            portal.classList.add('portal-active');

            // Sembunyikan Intro
            setTimeout(() => {
                introScreen.style.opacity = '0';
            }, 300);

            // Buka Layar Utama & Aktifkan Scroll Layar
            setTimeout(() => {
                introScreen.style.visibility = 'hidden';
                portal.style.opacity = '0';
                
                // BUKA SCROLL BODY
                document.body.style.overflowY = 'auto'; 
                
                mainScreen.classList.add('visible');
                initHeartParticles(); // Hujan partikel love
            }, 1000);
        }

        // CONTROL MUSIK (PLAY / PAUSE)
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.innerHTML = '🎵';
            } else {
                bgMusic.pause();
                musicBtn.innerHTML = '🔇';
            }
        }

        // SISTEM PARTIKEL HUJAN LOVE (CANVAS)
        function initHeartParticles() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const hearts = [];
            const heartCount = 50;

            class Heart {
                constructor() {
                    this.reset(true);
                }

                reset(firstRun = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = firstRun ? Math.random() * canvas.height : canvas.height + 20;
                    this.size = Math.random() * 16 + 8;
                    this.speedY = Math.random() * 1.5 + 0.8;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.02;
                    
                    const colors = ['#ff2e93', '#ff758c', '#a855f7', '#ff4d6d'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.01) * 0.5;
                    this.rotation += this.rotSpeed;

                    if (this.y < -30) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;

                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            for (let i = 0; i < heartCount; i++) {
                hearts.push(new Heart());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    heart.update();
                    heart.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
