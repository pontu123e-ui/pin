<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusus Buat Kamu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f051d;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- STAGE 1: INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #290a38 0%, #0f051d 100%);
            z-index: 10;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .btn-love {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2e93, #ff758c);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 46, 147, 0.6), 0 0 50px rgba(255, 117, 140, 0.4);
            animation: pulseLove 1.8s infinite ease-in-out;
            transition: transform 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .btn-love:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(255, 46, 147, 0.9), 0 0 70px rgba(255, 117, 140, 0.7);
        }

        @keyframes pulseLove {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- STAGE 2: ANIMASI PORTAL --- */
        #portal-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff2e93 0%, #a855f7 40%, transparent 70%);
            border: 4px solid #ff758c;
            box-shadow: 0 0 50px #ff2e93, inset 0 0 50px #a855f7;
            transform: translate(-50%, -50%) scale(0) rotate(0deg);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
        }

        .portal-active {
            animation: openPortal 1.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes openPortal {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                box-shadow: 0 0 100px #ff2e93, 0 0 200px #a855f7, inset 0 0 80px #ffffff;
            }
            100% {
                transform: translate(-50%, -50%) scale(300) rotate(720deg);
                opacity: 1;
            }
        }

        /* --- STAGE 3: MAIN LOVE SCENE --- */
        #main-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            background: radial-gradient(circle, #20052b 0%, #08020f 100%);
            z-index: 5;
        }

        #main-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* KARTU PESAN ROMANTIS */
        .love-card {
            position: relative;
            z-index: 6;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 117, 140, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 46, 147, 0.2);
            transform: translateY(30px);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        .love-card h1 {
            font-family: 'Sacramento', cursive;
            font-size: 52px;
            color: #ff758c;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
        }

        .love-card p {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .heart-badge {
            display: inline-block;
            font-size: 32px;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- STAGE 1: INTRO -->
    <div id="intro-screen">
        <button class="btn-love" onclick="enterPortal()">Pencet ini sayang 💖</button>
    </div>

    <!-- STAGE 2: ANIMASI PORTAL -->
    <div id="portal-overlay"></div>

    <!-- STAGE 3: TAMPIALAN UTAMA CINTA -->
    <div id="main-screen">
        <canvas id="heartCanvas"></canvas>
        
        <div class="love-card">
            <span class="heart-badge">💖</span>
            <h1>I Love You So Much</h1>
            <p>
                Terima kasih ya sudah hadir dan mewarnai hari-hariku.<br>
                Setiap detik sama kamu itu terasa berharga banget buat aku. 💕
            </p>
        </div>
    </div>

    <script>
        // --- 1. FUNGSI MASUK PORTAL ---
        function enterPortal() {
            const introScreen = document.getElementById('intro-screen');
            const portal = document.getElementById('portal-overlay');
            const mainScreen = document.getElementById('main-screen');

            // Jalankan animasi portal
            portal.classList.add('portal-active');

            // Sembunyikan tombol intro secara perlahan
            introScreen.style.opacity = '0';

            setTimeout(() => {
                introScreen.style.visibility = 'hidden';
            }, 800);

            // Setelah portal membesar penuh (1.5 detik), buka layar utama
            setTimeout(() => {
                mainScreen.classList.add('visible');
                initHeartParticles(); // Jalankan hujan love
            }, 1500);
        }

        // --- 2. SISTEM PARTIKEL HUJAN LOVE (CANVAS) ---
        function initHeartParticles() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const hearts = [];
            const heartCount = 65; // Jumlah love di layar

            class Heart {
                constructor() {
                    this.reset(true);
                }

                reset(firstRun = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = firstRun ? Math.random() * canvas.height : canvas.height + 20;
                    this.size = Math.random() * 18 + 10; // Ukuran love
                    this.speedY = Math.random() * 1.5 + 0.8; // Kecepatan naik
                    this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.02;
                    
                    // Variasi warna pink/merah/ungu romantis
                    const colors = ['#ff2e93', '#ff758c', '#a855f7', '#ff4d6d', '#ffffff'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.01) * 0.5; // Efek meliuk-liuk
                    this.rotation += this.rotSpeed;

                    if (this.y < -30) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;

                    // Menggambar bentuk Heart / Love dengan Path
                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            // Buat partikel love
            for (let i = 0; i < heartCount; i++) {
                hearts.push(new Heart());
            }

            // Loop Animasi
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    heart.update();
                    heart.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
