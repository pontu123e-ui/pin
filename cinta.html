<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusus Buat Kamu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0d0417;
            color: #ffffff;
            width: 100%;
            min-height: 100vh;
        }

        /* Tampilan awal saat belum pencet tombol (kunci scroll) */
        body.no-scroll {
            overflow: hidden !important;
            height: 100vh !important;
        }

        /* --- STAGE 1: INTRO SCREEN --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #3b074a 0%, #0d0417 100%);
            z-index: 9999;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.8s ease;
        }

        .portal-zoom-out {
            transform: scale(4) !important;
            opacity: 0 !important;
            pointer-events: none;
        }

        .btn-love {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2e93, #ff758c);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 46, 147, 0.8), 0 0 50px rgba(255, 117, 140, 0.5);
            animation: pulseLove 1.8s infinite ease-in-out;
            outline: none;
        }

        @keyframes pulseLove {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- STAGE 2: MAIN LOVE SCENE --- */
        #main-screen {
            position: relative;
            width: 100%;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 100px 20px;
        }

        #main-screen.visible {
            opacity: 1;
        }

        /* BACKGROUND CANVA PARTIKEL */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* KARTU UCAPAN */
        .love-card {
            position: relative;
            z-index: 5;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 117, 140, 0.4);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 46, 147, 0.2);
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .love-card h1 {
            font-family: 'Sacramento', cursive;
            font-size: 48px;
            color: #ff758c;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
        }

        .love-card p {
            font-size: 15px;
            color: #f1f5f9;
            line-height: 1.8;
        }

        /* GALERI FOTO */
        .gallery-title {
            position: relative;
            z-index: 5;
            font-size: 22px;
            font-weight: 600;
            color: #ff758c;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        .gallery-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
            max-width: 420px;
            align-items: center;
        }

        /* POLAROID CARD */
        .polaroid-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 15px 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 46, 147, 0.2);
            width: 100%;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .polaroid-card:nth-child(even) {
            transform: rotate(2deg);
        }

        .polaroid-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
        }

        .polaroid-caption {
            font-family: 'Sacramento', cursive;
            font-size: 28px;
            color: #333333;
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
        }

        /* TOMBOL MUSIK FLOATING */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 10000;
            background: rgba(255, 46, 147, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 46, 147, 0.8);
        }
    </style>
</head>
<body class="no-scroll">

    <!-- AUDIO: SAILOR SONG - GIGI PEREZ -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://files.catbox.moe/k3b02r.mp3" type="audio/mpeg">
        <source src="sailor_song.mp3" type="audio/mpeg">
    </audio>

    <!-- TOMBOL PLAY/PAUSE MUSIK -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

    <!-- STAGE 1: INTRO -->
    <div id="intro-screen">
        <button class="btn-love" onclick="enterPortal()">Pencet ini sayang 💖</button>
    </div>

    <!-- STAGE 2: UTAMA -->
    <div id="main-screen">
        <canvas id="heartCanvas"></canvas>
        
        <!-- KARTU UCAPAN -->
        <div class="love-card">
            <span style="font-size: 32px;">💖✨</span>
            <h1>I Love You So Much</h1>
            <p>
                Terima kasih ya sudah hadir dan mewarnai hari-hariku.<br>
                Setiap momen sama kamu selalu jadi hal terfavorit buat aku! 💕
            </p>
        </div>

        <div class="gallery-title">📜 Kenangan Indah Kita 📜</div>

        <!-- GALERI FOTO (BISA DI-SCROLL KE BAWAH) -->
        <div class="gallery-container">
            
            <div class="polaroid-card">
                <img src="https://picsum.photos/400/500?random=1" alt="Foto 1">
                <div class="polaroid-caption">Momen Pertama Kita 🌸</div>
            </div>

            <div class="polaroid-card">
                <img src="https://picsum.photos/400/500?random=2" alt="Foto 2">
                <div class="polaroid-caption">Senyuman Favoritku 😊</div>
            </div>

            <div class="polaroid-card">
                <img src="https://picsum.photos/400/500?random=3" alt="Foto 3">
                <div class="polaroid-caption">Jalan-jalan Bareng 💕</div>
            </div>

            <div class="polaroid-card">
                <img src="https://picsum.photos/400/500?random=4" alt="Foto 4">
                <div class="polaroid-caption">Selalu Sama Kamu Selamanya 🔒</div>
            </div>

        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');

        function enterPortal() {
            const introScreen = document.getElementById('intro-screen');
            const mainScreen = document.getElementById('main-screen');

            // 1. LANGSUNG PUTAR MUSIK SAILOR SONG
            bgMusic.play().then(() => {
                musicBtn.style.display = 'flex';
            }).catch(err => {
                console.log("Audio play error:", err);
                musicBtn.style.display = 'flex';
            });

            // 2. LEPAS KUNCI SCROLL BODY
            document.body.classList.remove('no-scroll');

            // 3. ANIMASI MASUK PORTAL
            introScreen.classList.add('portal-zoom-out');

            setTimeout(() => {
                introScreen.style.display = 'none'; // Hapus elemen intro agar tidak menghalangi sentuhan
                mainScreen.classList.add('visible');
                initHeartParticles();
            }, 700);
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.innerHTML = '🎵';
            } else {
                bgMusic.pause();
                musicBtn.innerHTML = '🔇';
            }
        }

        // HUJAN PARTIKEL LOVE
        function initHeartParticles() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const hearts = [];
            const heartCount = 40;

            class Heart {
                constructor() { this.reset(true); }

                reset(firstRun = false) {
                    this.x = Math.random() * canvas.width;
                    this.y = firstRun ? Math.random() * canvas.height : canvas.height + 20;
                    this.size = Math.random() * 15 + 8;
                    this.speedY = Math.random() * 1.5 + 0.8;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.02;
                    
                    const colors = ['#ff2e93', '#ff758c', '#a855f7', '#ff4d6d'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.01) * 0.5;
                    this.rotation += this.rotSpeed;
                    if (this.y < -30) this.reset();
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;

                    ctx.beginPath();
                    const topCurveHeight = this.size * 0.3;
                    ctx.moveTo(0, topCurveHeight);
                    ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                    ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                    ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            for (let i = 0; i < heartCount; i++) hearts.push(new Heart());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach(heart => {
                    heart.update();
                    heart.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
