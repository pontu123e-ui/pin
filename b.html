<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Key Grabber</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-6 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-4">Auto Key Grabber</h1>
        <input id="urlInput" type="text" placeholder="Masukkan Linkvertise / LootLabs Link..." class="w-full p-3 rounded bg-slate-700 text-white mb-4 border border-slate-600 focus:outline-none">
        <button onclick="getBypass()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-semibold">Ambil Key</button>
        
        <div id="result" class="mt-4 hidden p-3 bg-slate-700 rounded text-green-400 break-all"></div>
    </div>

    <script>
        async function getBypass() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            if(!url) return alert("Masukkan URL!");
            
            resultDiv.classList.remove('hidden');
            resultDiv.innerText = "Processing...";

            try {
                const res = await fetch(`/api/bypass?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if(data.success) {
                    resultDiv.innerText = "Key / Link Hasil: " + data.key;
                } else {
                    resultDiv.innerText = "Error: " + data.message;
                }
            } catch (err) {
                resultDiv.innerText = "Gagal terhubung ke server.";
            }
        }
    </script>
</body>
</html>
