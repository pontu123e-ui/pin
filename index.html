<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pin gantenk - Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0e0e12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #181820;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 220, 255, 0.2);
        }
        .profile {
            text-align: center;
            margin-bottom: 25px;
        }
        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00dcff, #ff82dc);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: bold;
            color: #fff;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 15px rgba(0, 220, 255, 0.4);
        }
        .name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }
        .bio {
            font-size: 12px;
            color: #aaa;
            background: #22222f;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .script-card {
            background: #20202c;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .script-card:hover {
            background: #282838;
            border-color: #00dcff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 220, 255, 0.15);
        }
        .script-info h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .script-info p {
            font-size: 10px;
            color: #888;
        }
        .btn-action {
            background: linear-gradient(135deg, #00dcff, #0088ff);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profil -->
        <div class="profile">
            <div class="avatar">P</div>
            <h1 class="name">pin gantenk</h1>
            <span class="bio">⚡ Roblox Luau Scripter</span>
        </div>

        <!-- Daftar Script -->
        <div class="links-container">
            
            <!-- Script Throw a Coin - Auto Sell -->
            <a href="https://pastebin.com/raw/Vs3ECvK8" target="_blank" class="script-card">
                <div class="script-info">
                    <h3>💰 Throw a Coin - Auto Sell</h3>
                    <p>Script auto-sell item dengan proteksi</p>
                </div>
                <button class="btn-action">Buka</button>
            </a>

            <!-- Script Tambahan Lainnya Bisa Disusul Nanti -->
            <a href="#" target="_blank" class="script-card">
                <div class="script-info">
                    <h3>✈️ Fly Menu Script</h3>
                    <p>Menu terbang anchor method</p>
                </div>
                <button class="btn-action">Buka</button>
            </a>

        </div>

        <div class="footer">
            &copy; 2026 pin gantenk. All rights reserved.
        </div>
    </div>
</body>
</html>
