<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Color3 Generator & Helper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #38bdf8;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 24px;
        }

        .preview-box {
            height: 100px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #475569;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        .output-box {
            background: #090d16;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1e293b;
        }

        .output-box code {
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
        }

        .btn-copy {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #0369a1;
        }

        .presets {
            margin-top: 20px;
        }

        .preset-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #475569;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .preset-btn:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Roblox Color3 Tools</h1>
    <p class="subtitle">Generator Kode Warna Luau & Roblox UI</p>

    <!-- Box Preview Warna -->
    <div class="preview-box" id="preview">Preview Warna</div>

    <!-- Color Picker -->
    <div class="input-group">
        <label for="colorPicker">Pilih Warna UI / Part:</label>
        <input type="color" id="colorPicker" value="#00a2ff">
    </div>

    <!-- Output Codes -->
    <div class="output-box">
        <code id="codeRGB">Color3.fromRGB(0, 162, 255)</code>
        <button class="btn-copy" onclick="copyText('codeRGB')">Copy</button>
    </div>

    <div class="output-box">
        <code id="codeFloat">Color3.new(0, 0.635, 1)</code>
        <button class="btn-copy" onclick="copyText('codeFloat')">Copy</button>
    </div>

    <!-- Presets -->
    <div class="presets">
        <div class="preset-title">Preset Warna Populer UI Roblox:</div>
        <div class="preset-buttons">
            <button class="preset-btn" style="background:#252525" onclick="setPreset('#252525')" title="Rayfield Dark"></button>
            <button class="preset-btn" style="background:#00a2ff" onclick="setPreset('#00a2ff')" title="Roblox Blue"></button>
            <button class="preset-btn" style="background:#ff4757" onclick="setPreset('#ff4757')" title="Red Alert"></button>
            <button class="preset-btn" style="background:#2ed573" onclick="setPreset('#2ed573')" title="Green Success"></button>
            <button class="preset-btn" style="background:#ffa502" onclick="setPreset('#ffa502')" title="Gold/Coins"></button>
            <button class="preset-btn" style="background:#7d5fff" onclick="setPreset('#7d5fff')" title="Neon Purple"></button>
        </div>
    </div>
</div>

<script>
    const picker = document.getElementById('colorPicker');
    const preview = document.getElementById('preview');
    const codeRGB = document.getElementById('codeRGB');
    const codeFloat = document.getElementById('codeFloat');

    function hexToRgb(hex) {
        let r = parseInt(hex.substring(1, 3), 16);
        let g = parseInt(hex.substring(3, 5), 16);
        let b = parseInt(hex.substring(5, 7), 16);
        return { r, g, b };
    }

    function updateColor(hex) {
        const { r, g, b } = hexToRgb(hex);
        preview.style.backgroundColor = hex;
        
        // Cek brightness biar teks di preview kelihatan
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        preview.style.color = brightness > 125 ? '#000000' : '#ffffff';

        // Update Luau Output
        codeRGB.innerText = `Color3.fromRGB(${r}, ${g}, ${b})`;
        codeFloat.innerText = `Color3.new(${(r/255).toFixed(3)}, ${(g/255).toFixed(3)}, ${(b/255).toFixed(3)})`;
    }

    picker.addEventListener('input', (e) => {
        updateColor(e.target.value);
    });

    function setPreset(hex) {
        picker.value = hex;
        updateColor(hex);
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text);
        alert('Kode berhasil dicopy: ' + text);
    }

    // Init awal
    updateColor(picker.value);
</script>

</body>
</html>
