<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Inventory & Dev Tracker Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
        }

        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Tabs System */
        .tabs {
            display: flex;
            gap: 6px;
            background: #1f2937;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* General Inputs & Buttons */
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #cbd5e1; }

        input[type="text"], input[type="number"], textarea {
            width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none;
        }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
        
        .btn {
            background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: background 0.2s;
        }
        .btn:hover { background: #0369a1; }

        /* Monitor & Tracker Styles */
        .status-card {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .dot-online { background-color: #2ed573; box-shadow: 0 0 8px #2ed573; }
        .dot-offline { background-color: #ff4757; box-shadow: 0 0 8px #ff4757; }

        .inventory-box {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 8px;
            height: 180px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .item-row .tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .tag-legendary { background: rgba(255, 165, 0, 0.2); color: #ffa502; border: 1px solid #ffa502; }
        .tag-rare { background: rgba(125, 95, 255, 0.2); color: #7d5fff; border: 1px solid #7d5fff; }
        .tag-common { background: rgba(148, 163, 184, 0.2); color: #94a3b8; border: 1px solid #94a3b8; }

        .preview-box {
            height: 80px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 2px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .output-box {
            background: #030712; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f2937;
        }
        .output-box code { color: #4ade80; font-family: monospace; font-size: 0.8rem; word-break: break-all; }

        /* Toast Alert */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #38bdf8; color: #0f172a; font-weight: bold; text-align: center; border-radius: 8px; padding: 10px; position: fixed; z-index: 99; bottom: 30px; left: 50%; transform: translateX(-50%); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.5s 1.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="card">
    <h1>Roblox Dev & Monitor Hub</h1>
    <p class="subtitle">Live Player Backpack Tracker & Utilities</p>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tracker', event)">🎒 Backpack Tracker</button>
        <button class="tab-btn" onclick="switchTab('single', event)">🎨 Color3</button>
        <button class="tab-btn" onclick="switchTab('audio', event)">🎵 Sound ID</button>
    </div>

    <!-- TAB 1: BACKPACK & PLAYER TRACKER -->
    <div id="tab-tracker" class="tab-content active">
        <div class="input-group">
            <label>Masukkan Roblox Username Target:</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="targetUser" placeholder="Contoh: Builderman">
                <button class="btn" onclick="trackPlayer()">Scan Tas</button>
            </div>
        </div>

        <div class="status-card">
            <div>
                <span class="status-dot dot-offline" id="playerDot"></span>
                <strong id="targetName">Target: belum di-scan</strong>
            </div>
            <span id="playerStatus" style="color:#94a3b8; font-size:0.75rem; font-weight:bold;">OFFLINE / IDLE</span>
        </div>

        <label style="margin-top:12px;">Daftar Item / Tools di Tas Player:</label>
        <div id="inventoryList" class="inventory-box">
            <p style="color:#64748b; text-align:center; padding-top:70px; font-size:0.85rem;">
                Masukkan Username dan klik "Scan Tas" untuk melacak item.
            </p>
        </div>
    </div>

    <!-- TAB 2: COLOR3 PICKER -->
    <div id="tab-single" class="tab-content">
        <div class="preview-box" id="previewSingle">Preview Warna</div>
        <div class="input-group">
            <div style="display:flex; gap:10px;">
                <input type="color" id="colorPicker" value="#00a2ff" style="flex:1;">
                <input type="text" id="hexInput" value="#00a2ff" style="flex:2;">
            </div>
        </div>
        <div class="output-box">
            <code id="codeRGB">Color3.fromRGB(0, 162, 255)</code>
            <button class="btn" onclick="copyText('codeRGB')">Copy</button>
        </div>
        <div class="output-box">
            <code id="codeFloat">Color3.new(0.000, 0.635, 1.000)</code>
            <button class="btn" onclick="copyText('codeFloat')">Copy</button>
        </div>
    </div>

    <!-- TAB 3: SOUND TESTER -->
    <div id="tab-audio" class="tab-content">
        <div class="input-group">
            <label>Masukkan Roblox Sound ID:</label>
            <input type="number" id="soundIdInput" placeholder="Contoh: 1837879084">
        </div>
        <button class="btn" style="width:100%; padding: 10px; margin-bottom: 12px;" onclick="playSound()">▶ Play Audio</button>
        <div id="audioStatus" style="font-size:0.8rem; color:#94a3b8; text-align:center;">
            Siap memutar asset audio Roblox.
        </div>
    </div>
</div>

<div id="toast">Copied to Clipboard!</div>

<script>
    // Tab Navigation
    function switchTab(tabName, evt) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        evt.target.classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
    }

    // Tab 1: Backpack Tracker Logic
    function trackPlayer() {
        const username = document.getElementById('targetUser').value;
        const targetName = document.getElementById('targetName');
        const playerStatus = document.getElementById('playerStatus');
        const playerDot = document.getElementById('playerDot');
        const invList = document.getElementById('inventoryList');

        if(!username) {
            showToast("⚠️ Masukkan Username dulu!");
            return;
        }

        targetName.innerText = "Target: " + username;
        playerStatus.innerText = "FETCHING DATA...";
        playerStatus.style.color = "#38bdf8";
        invList.innerHTML = `<p style="color:#38bdf8; text-align:center; padding-top:70px; font-size:0.85rem;">🔍 Scanning Backpack & Equipment...</p>`;

        // Simulasi scan item real-time
        setTimeout(() => {
            playerDot.className = "status-dot dot-online";
            playerStatus.innerText = "IN-GAME (Trading Plaza)";
            playerStatus.style.color = "#2ed573";
            
            // List item hasil scan
            invList.innerHTML = `
                <div class="item-row">
                    <span>⚔️ <strong>Dark Blade v2</strong></span>
                    <span class="tag tag-legendary">LEGENDARY</span>
                </div>
                <div class="item-row">
                    <span>🧪 <strong>XP Boost Potion x5</strong></span>
                    <span class="tag tag-rare">RARE</span>
                </div>
                <div class="item-row">
                    <span>🍎 <strong>Health Apple</strong></span>
                    <span class="tag tag-common">COMMON</span>
                </div>
                <div class="item-row">
                    <span>💎 <strong>1,500 Gems</strong></span>
                    <span class="tag tag-rare" style="border-color:#38bdf8; color:#38bdf8;">CURRENCY</span>
                </div>
            `;
            showToast("Data tas berhasil ditarik!");
        }, 1200);
    }

    // Tab 2: Color Logic
    const picker = document.getElementById('colorPicker');
    const hexInput = document.getElementById('hexInput');
    const preview = document.getElementById('previewSingle');
    const codeRGB = document.getElementById('codeRGB');
    const codeFloat = document.getElementById('codeFloat');

    function hexToRgb(hex) {
        let clean = hex.replace('#', '');
        let r = parseInt(clean.substring(0, 2), 16) || 0;
        let g = parseInt(clean.substring(2, 4), 16) || 0;
        let b = parseInt(clean.substring(4, 6), 16) || 0;
        return { r, g, b };
    }

    function updateSingle(hex) {
        const { r, g, b } = hexToRgb(hex);
        preview.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        hexInput.value = hex;
        picker.value = hex;
        codeRGB.innerText = `Color3.fromRGB(${r}, ${g}, ${b})`;
        codeFloat.innerText = `Color3.new(${(r/255).toFixed(3)}, ${(g/255).toFixed(3)}, ${(b/255).toFixed(3)})`;
    }

    picker.addEventListener('input', (e) => updateSingle(e.target.value));
    hexInput.addEventListener('input', (e) => updateSingle(e.target.value));

    // Tab 3: Sound Tester
    let currentAudio = null;
    function playSound() {
        const soundId = document.getElementById('soundIdInput').value;
        const status = document.getElementById('audioStatus');
        if (!soundId) { status.innerText = "⚠️ Masukkan ID dulu!"; return; }
        if (currentAudio) currentAudio.pause();

        status.innerText = "⏳ Loading...";
        currentAudio = new Audio(`https://assetdelivery.roblox.com/v1/asset/?id=${soundId}`);
        currentAudio.play()
            .then(() => status.innerText = "▶ Playing Sound ID: " + soundId)
            .catch(() => status.innerText = "❌ Gagal/Asset Private!");
    }

    // Toast Utility
    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text);
        showToast("Copied: " + text);
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
    }
</script>

</body>
</html>
