<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PKKMB Hand Tracker Logo ITH</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #video-container { position: relative; width: 100vw; height: 100vh; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status-info {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: bold; pointer-events: none; text-align: center; z-index: 10;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="video-container">
    <div id="status-info">Arahkan Tangan Menadah...</div>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas-container"></div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const container = document.getElementById('canvas-container');
    const statusInfo = document.getElementById('status-info');

    // --- 1. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Bikin Objek Logo (Memakai file 'logo.png' yang kamu upload)
    const textureLoader = new THREE.TextureLoader();
    const texture = textureLoader.load('logo.png'); 
    const geometry = new THREE.PlaneGeometry(1.2, 1.2);
    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
    const logoMesh = new THREE.Mesh(geometry, material);
    scene.add(logoMesh);
    logoMesh.visible = false;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function convertTo3D(x, y) {
      const normX = -((x) * 2 - 1); 
      const normY = -(y * 2 - 1);

      const vector = new THREE.Vector3(normX, normY, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // --- 2. MEDIAPIPE HANDS SETUP ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Titik Pangkal Telapak (Landmark 9)
        const centerPalm = landmarks[9];
        const pos3D = convertTo3D(centerPalm.x, centerPalm.y);

        // Posisikan logo melayang persis DI ATAS telapak tangan yang menadah
        logoMesh.position.set(pos3D.x, pos3D.y + 0.4, pos3D.z);

        const wrist = landmarks[0];
        const indexMCP = landmarks[5];
        const pinkyMCP = landmarks[17];
        const middleTip = landmarks[12];

        // Cek apakah posisi tangan menadah (bukan melambai berdiri)
        const isUprightWaving = wrist.y - middleTip.y > 0.25; 
        
        // Cek apakah telapak tangan terbuka
        const palmWidth = Math.hypot(indexMCP.x - pinkyMCP.x, indexMCP.y - pinkyMCP.y);
        const isOpenPalm = palmWidth > 0.12;

        if (!isUprightWaving && isOpenPalm) {
          logoMesh.visible = true;
          logoMesh.rotation.y += 0.08; // Logo Berputar
          statusInfo.innerText = "✨ Posisi Menadah Pas! Logo ITH Berputar";
          statusInfo.style.background = "rgba(0, 180, 0, 0.8)";
        } else if (isUprightWaving) {
          logoMesh.visible = false;
          statusInfo.innerText = "🖐️ Posisikan Tangan Menadah (Bukan Melambai)";
          statusInfo.style.background = "rgba(200, 50, 0, 0.8)";
        } else {
          logoMesh.visible = false;
          statusInfo.innerText = "🤲 Buka Telapak Tanganmu";
          statusInfo.style.background = "rgba(200, 120, 0, 0.8)";
        }
      } else {
        logoMesh.visible = false;
        statusInfo.innerText = "🤲 Menadahkan Tangan ke Kamera";
        statusInfo.style.background = "rgba(0,0,0,0.7)";
      }
    });

    // --- 3. JALANKAN KAMERA HP ---
    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    cameraUtils.start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
