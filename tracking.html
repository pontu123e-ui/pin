<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PKKMB Hand Tracker Logo</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #video-container { position: relative; width: 100vw; height: 100vh; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status-info {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: bold; pointer-events: none; text-align: center; z-index: 10;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="video-container">
    <div id="status-info">Mengarahkan Kamera...</div>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas-container"></div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const container = document.getElementById('canvas-container');
    const statusInfo = document.getElementById('status-info');

    // --- 1. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Bikin Objek Logo (Ganti URL ini dengan logo kampusmu)
    const textureLoader = new THREE.TextureLoader();
    const texture = textureLoader.load('https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg'); 
    const geometry = new THREE.PlaneGeometry(1.2, 1.2);
    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
    const logoMesh = new THREE.Mesh(geometry, material);
    scene.add(logoMesh);
    logoMesh.visible = false;

    // Menyesuaikan ukuran layar jika HP di-rotate
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Conversi Koordinat 2D Layar HP ke 3D World
    function convertTo3D(x, y) {
      // Mirroring X agar pas dengan tampilan kamera depan
      const normX = -((x) * 2 - 1); 
      const normY = -(y * 2 - 1);

      const vector = new THREE.Vector3(normX, normY, 0.5);
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // --- 2. MEDIAPIPE HANDS SETUP ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Titik Tengah Telapak Tangan (Landmark 9)
        const centerPalm = landmarks[9];
        const pos3D = convertTo3D(centerPalm.x, centerPalm.y);

        // Posisikan logo melayang pas di atas telapak tangan
        logoMesh.position.set(pos3D.x, pos3D.y + 0.3, pos3D.z);

        // --- CEK APAKAH JARI-JARI TERBUKA ---
        // Cek jarak ujung 4 jari ke pergelangan tangan (Landmark 0)
        const wrist = landmarks[0];
        const indexOpen  = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y) > 0.25;
        const middleOpen = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y) > 0.25;
        const ringOpen   = Math.hypot(landmarks[16].x - wrist.x, landmarks[16].y - wrist.y) > 0.25;
        const pinkyOpen  = Math.hypot(landmarks[20].x - wrist.x, landmarks[20].y - wrist.y) > 0.25;

        const isHandOpen = indexOpen && middleOpen && ringOpen && pinkyOpen;

        if (isHandOpen) {
          logoMesh.visible = true;
          logoMesh.rotation.y += 0.08; // Logo Berputar
          statusInfo.innerText = "✨ Telapak Terbuka: Logo Berputar!";
          statusInfo.style.background = "rgba(0, 180, 0, 0.8)";
        } else {
          logoMesh.visible = false;
          statusInfo.innerText = "✊ Tangan Terdeteksi (Buka Jari-Jari)";
          statusInfo.style.background = "rgba(200, 120, 0, 0.8)";
        }
      } else {
        logoMesh.visible = false;
        statusInfo.innerText = "✋ Tunjukkan Tangan ke Kamera";
        statusInfo.style.background = "rgba(0,0,0,0.7)";
      }
    });

    // --- 3. JALANKAN KAMERA HP ---
    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    cameraUtils.start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
