<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Link Unlimited - Local Server</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h2 { text-align: center; margin-top: 0; color: #38bdf8; }
        p { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        .result {
            margin-top: 20px;
            padding: 14px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
            word-break: break-all;
        }
        .result a { color: #4ade80; text-decoration: none; font-weight: bold; }
        .status { font-size: 12px; color: #f59e0b; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Link Bypasser</h2>
    <p>Bypass Lootlabs & lainnya menggunakan server lokal Termux</p>
    
    <input type="text" id="linkInput" placeholder="Tempelkan link di sini...">
    <button onclick="startBypass()">Bypass Sekarang</button>

    <div id="resultContainer" class="result">
        <div id="statusText" class="status">Menghubungkan ke Termux...</div>
        <a id="outputLink" href="#" target="_blank">---</a>
    </div>
</div>

<script>
async function startBypass() {
    const inputUrl = document.getElementById('linkInput').value.trim();
    const resultBox = document.getElementById('resultContainer');
    const statusText = document.getElementById('statusText');
    const outputLink = document.getElementById('outputLink');

    if (!inputUrl) {
        alert("Masukkan link-nya dulu bro!");
        return;
    }

    resultBox.style.display = 'block';
    statusText.textContent = "Mengirim ke server Termux...";
    statusText.style.color = "#f59e0b";
    outputLink.textContent = "Memproses...";
    outputLink.href = "#";

    try {
        // Mengarah ke server lokal Termux yang sedang aktif di HP kamu
        const endpoint = `http://localhost:3000/api/bypass?url=${encodeURIComponent(inputUrl)}`;
        
        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.status === 'success' && data.result) {
            statusText.textContent = "Berhasil!";
            statusText.style.color = "#4ade80";
            outputLink.textContent = data.result;
            outputLink.href = data.result;
        } else {
            throw new Error(data.message || "Gagal diproses");
        }
    } catch (error) {
        statusText.textContent = "Gagal terhubung";
        statusText.style.color = "#ef4444";
        outputLink.textContent = "Pastikan server Termux (`node server.js`) menyala dan tidak ditutup!";
    }
}
</script>

</body>
</html>
