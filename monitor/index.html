<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Roblox Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold mb-4 text-emerald-400">📊 Live Stock Monitor</h1>
        <div id="stock-container" class="space-y-3">
            <p class="text-gray-400">Loading data...</p>
        </div>
        <p id="time" class="text-xs text-gray-500 mt-4"></p>
    </div>

    <script>
        // Perhatikan bagian '../' ini, karena file json ada di folder luar
        fetch('../stock.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('stock-container').innerHTML = `
                    <div class="p-4 bg-slate-700 rounded-lg">
                        <p class="text-sm">Game: ${data.gameName}</p>
                        <p class="text-2xl font-bold text-white mt-1">Status: ${data.status}</p>
                    </div>
                `;
                document.getElementById('time').innerText = "Update terakhir: " + new Date(data.updatedAt).toLocaleTimeString();
            })
            .catch(() => {
                document.getElementById('stock-container').innerHTML = "<p class='text-red-400'>Data belum tersedia/Gagal load.</p>";
            });
    </script>
</body>
</html>
