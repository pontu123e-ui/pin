<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybaras VS Plants - Stock Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-4">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold mb-4 text-emerald-400">🌱 Capybaras VS Plants Monitor</h1>
        
        <div id="stock-container" class="space-y-3">
            <p class="text-gray-400">Loading data stok...</p>
        </div>
        
        <p id="time" class="text-xs text-gray-500 mt-4 text-center"></p>
    </div>

    <script>
        fetch('../stock.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('stock-container').innerHTML = `
                    <div class="p-4 bg-slate-700 rounded-lg space-y-2">
                        <p class="text-sm font-semibold text-emerald-300">${data.gameName}</p>
                        <p class="text-xs text-gray-300">Pemain Aktif: ${data.playing || 0}</p>
                        <hr class="border-slate-600 my-2">
                        <div class="flex justify-between items-center">
                            <span class="text-sm">🦫 NPC Capybara Stock:</span>
                            <span class="font-bold text-yellow-400">${data.capybaraStock}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm">⚙️ NPC Gear Stock:</span>
                            <span class="font-bold text-cyan-400">${data.gearStock}</span>
                        </div>
                    </div>
                `;
                document.getElementById('time').innerText = "Update terakhir: " + new Date(data.updatedAt).toLocaleString('id-ID');
            })
            .catch(() => {
                document.getElementById('stock-container').innerHTML = "<p class='text-red-400'>Gagal memuat data stok.</p>";
            });
    </script>
</body>
</html>
