<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIN_SYSTEM // SECRET_TERMINAL_V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
        }

        body {
            background-color: #030508;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* MATRIX CANVAS BACKGROUND */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }

        /* SCANLINE CRT EFFECT */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* TERMINAL CONTAINER */
        .terminal-container {
            width: 100%;
            max-width: 750px;
            height: 88vh;
            background: rgba(10, 15, 24, 0.92);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 3;
            backdrop-filter: blur(8px);
            overflow: hidden;
            position: relative;
        }

        /* TERMINAL HEADER */
        .terminal-header {
            background: #0d131f;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            font-size: 11px;
            color: #00f0ff;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* TERMINAL BODY */
        .terminal-body {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            line-height: 1.4;
            scroll-behavior: smooth;
        }

        .output-line {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .output-line.system { color: #8a99ad; }
        .output-line.success { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
        .output-line.cyan { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
        .output-line.error { color: #ff4d4d; text-shadow: 0 0 8px rgba(255, 77, 77, 0.6); }
        .output-line.warning { color: #ffbd2e; }
        .output-line.monster { color: #ff0055; font-weight: bold; text-shadow: 0 0 12px #ff0055; }
        .output-line.fire { color: #ff6600; font-weight: bold; text-shadow: 0 0 10px #ff6600; }
        .output-line.zap { color: #ffff00; font-weight: bold; text-shadow: 0 0 10px #ffff00; }

        /* QUICK ACTION BUTTONS BAR */
        .quick-bar {
            background: #090e17;
            padding: 8px 10px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            scrollbar-width: none;
        }
        .quick-bar::-webkit-scrollbar { display: none; }

        .btn-quick {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-quick:active {
            transform: scale(0.92);
            background: #00f0ff;
            color: #000;
        }

        .btn-quick.fire-btn { border-color: #ff6600; color: #ff6600; background: rgba(255, 102, 0, 0.1); }
        .btn-quick.zap-btn { border-color: #ffff00; color: #ffff00; background: rgba(255, 255, 0, 0.1); }
        .btn-quick.monster-btn { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.1); }

        /* INPUT PROMPT */
        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #070b12;
            border-top: 1px solid rgba(0, 240, 255, 0.15);
        }

        .prompt-symbol {
            color: #00f0ff;
            font-weight: bold;
            white-space: nowrap;
            font-size: 12px;
        }

        .cmd-input {
            background: transparent;
            border: none;
            outline: none;
            color: #00ff66;
            font-size: 12px;
            width: 100%;
            caret-color: #00ff66;
        }

        /* SECRET VAULT MODAL POPUP */
        .secret-vault-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 8, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: glitchFade 0.4s ease-out;
        }

        @keyframes glitchFade {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        .vault-card {
            background: #0d131f;
            border: 2px solid #00ff66;
            border-radius: 16px;
            padding: 25px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.4);
        }

        .vault-card h2 {
            color: #00ff66;
            font-size: 18px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff66;
        }

        .vault-card p {
            color: #cbd5e1;
            font-size: 11px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .secret-box {
            background: rgba(0, 255, 102, 0.08);
            border: 1px dashed #00ff66;
            padding: 12px;
            border-radius: 8px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-close-vault {
            background: linear-gradient(135deg, #00ff66, #009944);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <!-- DIGITAL RAIN BACKGROUND -->
    <canvas id="matrixCanvas"></canvas>
    <div class="scanline"></div>

    <!-- TERMINAL MAIN CONTAINER -->
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">⚡ PIN_SYSTEM_SERVER // SECURE_SHELL_V2</div>
        </div>

        <div class="terminal-body" id="terminalBody">
            <!-- BOOT LOGS WILL BE TYPED HERE AUTOMATICALLY -->
        </div>

        <!-- QUICK ACTION BUTTONS BAR (SANGAT COCOK UNTUK HP) -->
        <div class="quick-bar">
            <button class="btn-quick monster-btn" onclick="execQuick('monster')">👹 Boss</button>
            <button class="btn-quick" onclick="execQuick('pasukan')">👾 Pasukan (1)</button>
            <button class="btn-quick fire-btn" onclick="execQuick('api')">🔥 Api (2)</button>
            <button class="btn-quick zap-btn" onclick="execQuick('listrik')">⚡ Petir (3)</button>
            <button class="btn-quick" onclick="execQuick('serang')">⚔️ Serang (4)</button>
            <button class="btn-quick" onclick="execQuick('clear')">🧹 Clear</button>
        </div>

        <!-- INPUT PROMPT -->
        <div class="input-line" id="activeInputLine">
            <span class="prompt-symbol">guest@pin-net:~$</span>
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Ketik perintah/angka..." autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- SECRET VAULT POPUP MODAL -->
    <div class="secret-vault-modal" id="secretVault">
        <div class="vault-card">
            <h2>🔓 ACCESS GRANTED!</h2>
            <p>Selamat bro! Kamu berhasil mengalahkan Boss & membobol <b>PIN Terminal</b>:</p>
            
            <div class="secret-box">
                🎁 SCRIPT_EXCLUSIV_KEY: "PIN_GANTENK_SUPREME_2026"
            </div>

            <p style="font-size:10px; color:#8a99ad;">Tunjukkan pesan ini ke WhatsApp <b>pin gantenk</b> buat klaim bonus spesial!</p>

            <button class="btn-close-vault" onclick="closeVault()">TUTUP VAULT ⚡</button>
        </div>
    </div>

    <script>
        // --- 1. GAME DATA & AUDIO SYNTHESIZER ---
        let isSoundEnabled = true;
        let monsterHP = 0;
        const monsterMaxHP = 100;
        let hasArmy = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq = 800, type = 'sine', duration = 0.05) {
            if (!isSoundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playMonsterRoar() {
            if (!isSoundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }

        function playFireSound() {
            if (!isSoundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e){}
        }

        function playZapSound() {
            if (!isSoundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime + 0.05);
                osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }

        // --- 2. MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = '01100101PIN_GANTENK_ROBLOX_KILLUA_⚡🔮';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 5, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- 3. TERMINAL LOGIC & COMMANDS ---
        const terminalBody = document.getElementById('terminalBody');
        const cmdInput = document.getElementById('cmdInput');

        const bootSequence = [
            { text: "[BOOT] Initializing PIN_CORE Kernel v2.6.0...", class: "system" },
            { text: "[NET] Connecting to Firebase Realtime Server... CONNECTED 🟢", class: "cyan" },
            { text: "------------------------------------------------------------", class: "system" },
            { text: "WELCOME TO PIN_GANTENK TERMINAL BATTLE ⚡", class: "success" },
            { text: "Pencet tombol di bawah atau ketik angka 1-4 untuk bertarung!", class: "cyan" },
            { text: "------------------------------------------------------------", class: "system" }
        ];

        let lineIndex = 0;

        function typeBootSequence() {
            if (lineIndex < bootSequence.length) {
                appendOutput(bootSequence[lineIndex].text, bootSequence[lineIndex].class);
                playBeep(600 + (lineIndex * 100), 'square', 0.03);
                lineIndex++;
                setTimeout(typeBootSequence, 150);
            }
        }

        function appendOutput(text, className = "system") {
            const div = document.createElement('div');
            div.className = `output-line ${className}`;
            div.innerHTML = text;
            terminalBody.appendChild(div);
            
            // Smooth Auto-scroll
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function execQuick(cmd) {
            handleCommand(cmd);
        }

        function renderHPBar() {
            const filled = Math.max(0, Math.ceil(monsterHP / 10));
            const empty = 10 - filled;
            return `[${"█".repeat(filled)}${"░".repeat(empty)}] ${monsterHP}/${monsterMaxHP} HP`;
        }

        function applyDamage(damage, attackName, colorClass) {
            if (monsterHP <= 0) {
                appendOutput("❌ Monster belum dipanggil! Pencet tombol <b style='color:#ff0055;'>👹 Boss</b> dulu.", "warning");
                return;
            }

            monsterHP = Math.max(0, monsterHP - damage);
            appendOutput(`💥 ${attackName}: -${damage} HP!`, colorClass);
            appendOutput(`👹 CYBER BOSS HP: ${renderHPBar()}`, monsterHP > 0 ? "error" : "success");

            if (monsterHP <= 0) {
                setTimeout(() => {
                    appendOutput("☠️ BOOMMM! CYBER MONSTER HANCUR LLEBUR!", "success");
                    appendOutput("🏆 PASUKAN PIXEL MENANG! Hadiah Vault terbuka...", "cyan");
                    playBeep(1200, 'sawtooth', 0.3);
                    setTimeout(() => {
                        document.getElementById('secretVault').style.display = 'flex';
                    }, 500);
                }, 200);
            }
        }

        function handleCommand(cmd) {
            if (!cmd) return;

            appendOutput(`<span style="color:#00f0ff;">guest@pin-net:~$</span> ${cmd}`, "system");

            // SHORTCUT ANGKA DUKUNGAN UNTUK HP
            if (cmd === '1') cmd = 'pasukan';
            if (cmd === '2') cmd = 'api';
            if (cmd === '3') cmd = 'listrik';
            if (cmd === '4') cmd = 'serang';

            switch(cmd) {
                case 'help':
                    appendOutput("--- PERINTAH TERSEDIA ---", "cyan");
                    appendOutput("Pencet tombol di bawah atau gunakan angka singkat:", "system");
                    appendOutput("<b>1</b> / pasukan : Panggil Pasukan Pixel 👾", "cyan");
                    appendOutput("<b>2</b> / api     : Skill Bola Api 🔥 (-35 HP)", "fire");
                    appendOutput("<b>3</b> / listrik : Skill Petir Cyber ⚡ (-45 HP)", "zap");
                    appendOutput("<b>4</b> / serang  : Pukulan Pasukan (-20 HP)", "success");
                    appendOutput("<b>monster</b>    : Memanggil Boss Monster", "monster");
                    appendOutput("<b>clear</b>      : Bersihkan layar", "system");
                    break;

                case 'monster':
                case 'boss':
                    monsterHP = 100;
                    playMonsterRoar();
                    const monsterArt = 
`
          ______  
       .-"      "-.  
      /            \\  
     |  (o)    (o)  |  
     |      /\\      |  
      \\   '----'   /  
       \`----------\`  
👹 BOSS LEVEL 99 [ ${renderHPBar()} ]
`;
                    appendOutput(monsterArt, "monster");
                    appendOutput("👹 'SIAPA BERANI MELAWANKU?!'", "error");
                    break;

                case 'pasukan':
                    hasArmy = true;
                    playBeep(900, 'triangle', 0.1);
                    appendOutput("👾👾👾 PASUKAN PIXEL CYBER DIPANGGIL!", "cyan");
                    break;

                case 'api':
                    playFireSound();
                    appendOutput("🔥 (════════►) BOLA API MELUNCUR!", "fire");
                    applyDamage(35, "SKILL BOLA API", "fire");
                    break;

                case 'listrik':
                    playZapSound();
                    appendOutput("⚡⚡⚡ PETIR CYBER MENYENGAT!", "zap");
                    applyDamage(45, "SKILL PETIR CYBER", "zap");
                    break;

                case 'serang':
                    if (!hasArmy) {
                        appendOutput("⚠️ Panggil <b style='color:#00f0ff;'>Pasukan (1)</b> terlebih dahulu!", "warning");
                        break;
                    }
                    playBeep(700, 'square', 0.08);
                    appendOutput("⚔️ 👾👾👾 PASUKAN MAJU MENGEROYOK BOSS!", "cyan");
                    applyDamage(20, "SERANGAN PASUKAN", "cyan");
                    break;

                case 'clear':
                    terminalBody.innerHTML = '';
                    break;

                case 'access':
                case 'killua':
                    document.getElementById('secretVault').style.display = 'flex';
                    break;

                default:
                    appendOutput(`Perintah '${cmd}' tidak dikenal. Ketik <b>help</b>.`, "error");
                    break;
            }

            cmdInput.value = '';
        }

        cmdInput.addEventListener('keydown', function(e) {
            playBeep(400, 'triangle', 0.02);
            if (e.key === 'Enter') {
                const command = this.value.trim().toLowerCase();
                handleCommand(command);
            }
        });

        function closeVault() {
            document.getElementById('secretVault').style.display = 'none';
        }

        window.onload = () => {
            setTimeout(typeBootSequence, 200);
        };
    </script>
</body>
</html>
