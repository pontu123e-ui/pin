<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIN_SYSTEM // SECRET_TERMINAL_V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            background-color: #030508;
            color: #00ff66;
            overflow-y: auto; /* BISA DI-SCROLL DI HP */
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            position: relative;
        }

        /* MATRIX CANVAS BACKGROUND */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* SCANLINE CRT EFFECT */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* TERMINAL CONTAINER */
        .terminal-container {
            width: 100%;
            max-width: 750px;
            height: 92dvh; /* Menggunakan dvh agar pas di layar HP */
            background: rgba(10, 15, 24, 0.95);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            display: flex;
            flex-direction: column;
            z-index: 10;
            backdrop-filter: blur(8px);
            position: relative;
            margin: auto;
        }

        /* TERMINAL HEADER */
        .terminal-header {
            background: #0d131f;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            flex-shrink: 0;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            font-size: 10px;
            color: #00f0ff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* TERMINAL BODY */
        .terminal-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            line-height: 1.4;
        }

        .output-line {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .output-line.system { color: #8a99ad; }
        .output-line.success { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
        .output-line.cyan { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6); }
        .output-line.error { color: #ff4d4d; text-shadow: 0 0 8px rgba(255, 77, 77, 0.6); }
        .output-line.warning { color: #ffbd2e; }

        /* BATTLE ARENA REAL-TIME VISUAL CONTAINER */
        .battle-arena-box {
            position: relative;
            background: rgba(0, 240, 255, 0.05);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 14px 8px;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.15);
            flex-shrink: 0;
        }

        .arena-side {
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .boss-avatar {
            font-size: 32px;
            display: inline-block;
            transition: transform 0.1s;
        }

        .boss-hit {
            animation: bossDamage 0.35s ease-in-out;
        }

        @keyframes bossDamage {
            0%, 100% { transform: translateX(0) scale(1); filter: none; }
            25% { transform: translateX(-10px) scale(1.2); filter: drop-shadow(0 0 15px #ff0055) brightness(1.8); }
            75% { transform: translateX(10px) scale(0.9); filter: drop-shadow(0 0 15px #ff0055) brightness(1.8); }
        }

        .army-avatar {
            font-size: 22px;
            display: inline-block;
            transition: transform 0.2s;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
        }

        .army-idle {
            animation: pixelBounce 0.6s infinite alternate ease-in-out;
        }

        @keyframes pixelBounce {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-4px); }
        }

        .army-dash {
            animation: armyDashAnim 0.4s ease-in-out;
        }

        @keyframes armyDashAnim {
            0% { transform: translateX(0); }
            50% { transform: translateX(-80px) scale(1.3); }
            100% { transform: translateX(0); }
        }

        .arena-middle-track {
            position: relative;
            flex: 1.2;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .projectile-fire {
            position: absolute;
            font-size: 20px;
            animation: flyToBoss 0.45s ease-in forwards;
        }

        @keyframes flyToBoss {
            0% { right: 0%; opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; }
            100% { right: 80%; opacity: 1; transform: scale(1.4); }
        }

        .projectile-zap {
            position: absolute;
            font-size: 22px;
            animation: flyZapToBoss 0.35s ease-in forwards;
        }

        @keyframes flyZapToBoss {
            0% { right: 0%; opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.8); }
            100% { right: 80%; opacity: 1; transform: scale(1.2); }
        }

        /* QUICK ACTION BUTTONS BAR - MOBILE OPTIMIZED */
        .quick-bar {
            background: #090e17;
            padding: 8px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 20;
        }
        .quick-bar::-webkit-scrollbar { display: none; }

        .btn-quick {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 10px 14px; /* DIPERBESAR BIAR MUDAH DIPENCET */
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation; /* SUPAYA LANGSUNG RESPONSIVE DI HP */
            user-select: none;
            flex-shrink: 0;
            transition: background 0.1s, transform 0.1s;
        }

        .btn-quick:active {
            transform: scale(0.92);
            background: #00f0ff;
            color: #000;
        }

        .btn-quick.fire-btn { border-color: #ff6600; color: #ff6600; background: rgba(255, 102, 0, 0.15); }
        .btn-quick.zap-btn { border-color: #ffff00; color: #ffff00; background: rgba(255, 255, 0, 0.15); }
        .btn-quick.monster-btn { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.15); }

        /* INPUT PROMPT */
        .input-line {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: #070b12;
            border-top: 1px solid rgba(0, 240, 255, 0.15);
            flex-shrink: 0;
        }

        .prompt-symbol {
            color: #00f0ff;
            font-weight: bold;
            white-space: nowrap;
            font-size: 11px;
        }

        .cmd-input {
            background: transparent;
            border: none;
            outline: none;
            color: #00ff66;
            font-size: 12px;
            width: 100%;
            caret-color: #00ff66;
        }

        /* SECRET VAULT MODAL POPUP */
        .secret-vault-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 8, 0.94);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            padding: 15px;
        }

        .vault-card {
            background: #0d131f;
            border: 2px solid #00ff66;
            border-radius: 16px;
            padding: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
        }

        .vault-card h2 {
            color: #00ff66;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .vault-card p {
            color: #cbd5e1;
            font-size: 11px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .secret-box {
            background: rgba(0, 255, 102, 0.1);
            border: 1px dashed #00ff66;
            padding: 10px;
            border-radius: 8px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .btn-close-vault {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <!-- DIGITAL RAIN BACKGROUND -->
    <canvas id="matrixCanvas"></canvas>
    <div class="scanline"></div>

    <!-- TERMINAL MAIN CONTAINER -->
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">⚡ PIN_SYSTEM_SERVER // SECURE_SHELL_V2</div>
        </div>

        <div class="terminal-body" id="terminalBody">
            <!-- LOGS DIPANGGIL DISINI -->
        </div>

        <!-- QUICK ACTION BUTTONS BAR -->
        <div class="quick-bar">
            <button type="button" class="btn-quick monster-btn" onclick="execQuick('monster')">👹 Boss</button>
            <button type="button" class="btn-quick" onclick="execQuick('pasukan')">👾 Pasukan (1)</button>
            <button type="button" class="btn-quick fire-btn" onclick="execQuick('api')">🔥 Api (2)</button>
            <button type="button" class="btn-quick zap-btn" onclick="execQuick('listrik')">⚡ Petir (3)</button>
            <button type="button" class="btn-quick" onclick="execQuick('serang')">⚔️ Serang (4)</button>
            <button type="button" class="btn-quick" onclick="execQuick('clear')">🧹 Clear</button>
        </div>

        <!-- INPUT PROMPT -->
        <div class="input-line" id="activeInputLine">
            <span class="prompt-symbol">guest@pin-net:~$</span>
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Ketik perintah/angka..." autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- SECRET VAULT POPUP MODAL -->
    <div class="secret-vault-modal" id="secretVault">
        <div class="vault-card">
            <h2>🔓 ACCESS GRANTED!</h2>
            <p>Selamat bro! Kamu berhasil mengalahkan Boss & membobol <b>PIN Terminal</b>:</p>
            
            <div class="secret-box">
                🎁 SCRIPT_EXCLUSIV_KEY: "PIN_GANTENK_SUPREME_2026"
            </div>

            <p style="font-size:10px; color:#8a99ad;">Tunjukkan pesan ini ke WhatsApp <b>pin gantenk</b> buat klaim bonus spesial!</p>

            <button type="button" class="btn-close-vault" onclick="closeVault()">TUTUP VAULT ⚡</button>
        </div>
    </div>

    <script>
        // --- 1. GAME DATA & AUDIO SYNTHESIZER ---
        let isSoundEnabled = true;
        let monsterHP = 0;
        const monsterMaxHP = 100;
        let hasArmy = false;
        let activeArenaEl = null;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Auto unlock audio saat layar HP disentuh
        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('click', initAudio, { once: true });

        function playBeep(freq = 800, type = 'sine', duration = 0.05) {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playMonsterRoar() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e){}
        }

        function playFireSound() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e){}
        }

        function playZapSound() {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e){}
        }

        // --- 2. MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const matrixChars = '01100101PIN_GANTENK_KILLUA_⚡🔮';
        const fontSize = 12;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 5, 8, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- 3. TERMINAL LOGIC & COMMANDS ---
        const terminalBody = document.getElementById('terminalBody');
        const cmdInput = document.getElementById('cmdInput');

        const bootSequence = [
            { text: "[BOOT] Initializing PIN_CORE Kernel v2.6.0...", class: "system" },
            { text: "[NET] Realtime Server... CONNECTED 🟢", class: "cyan" },
            { text: "------------------------------------------------------------", class: "system" },
            { text: "WELCOME TO PIN_GANTENK TERMINAL BATTLE ⚡", class: "success" },
            { text: "Pencet tombol di bawah untuk bertarung di HP!", class: "cyan" },
            { text: "------------------------------------------------------------", class: "system" }
        ];

        let lineIndex = 0;

        function typeBootSequence() {
            if (lineIndex < bootSequence.length) {
                appendOutput(bootSequence[lineIndex].text, bootSequence[lineIndex].class);
                lineIndex++;
                setTimeout(typeBootSequence, 120);
            }
        }

        function appendOutput(text, className = "system") {
            const div = document.createElement('div');
            div.className = `output-line ${className}`;
            div.innerHTML = text;
            terminalBody.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
            return div;
        }

        function execQuick(cmd) {
            initAudio();
            handleCommand(cmd);
        }

        function renderHPBar() {
            const filled = Math.max(0, Math.ceil(monsterHP / 10));
            const empty = 10 - filled;
            return `[${"█".repeat(filled)}${"░".repeat(empty)}] ${monsterHP}/${monsterMaxHP}`;
        }

        function renderArenaBox() {
            const arenaDiv = document.createElement('div');
            arenaDiv.className = 'battle-arena-box';
            arenaDiv.id = 'activeArena';
            arenaDiv.innerHTML = `
                <div class="arena-side">
                    <div class="boss-avatar" id="bossAvatar">👹</div>
                    <div style="color:#ff0055; font-weight:bold; font-size:10px;">BOSS LV.99</div>
                    <div style="font-size:9px; color:#ff4d4d;" id="bossHpText">${renderHPBar()}</div>
                </div>
                <div class="arena-middle-track" id="middleTrack">
                    <span style="font-size:10px; color:#ff6600; font-weight:bold;" id="vsLabel">⚔️ VS ⚔️</span>
                </div>
                <div class="arena-side">
                    <div class="army-avatar ${hasArmy ? 'army-idle' : ''}" id="armyAvatar">${hasArmy ? '👾 👾 👾' : '💤'}</div>
                    <div style="color:#00f0ff; font-weight:bold; font-size:10px;">PASUKAN</div>
                    <div style="font-size:9px; color:${hasArmy ? '#00ff66' : '#8a99ad'};" id="armyStatusText">${hasArmy ? 'Battle Ready!' : 'Panggil [1]'}</div>
                </div>
            `;
            terminalBody.appendChild(arenaDiv);
            terminalBody.scrollTop = terminalBody.scrollHeight;
            activeArenaEl = arenaDiv;
        }

        function updateArenaHP() {
            const hpEl = document.getElementById('bossHpText');
            if (hpEl) hpEl.innerText = renderHPBar();
        }

        function triggerBossHitEffect(damage) {
            const bossAvatar = document.getElementById('bossAvatar');
            if (!bossAvatar) return;

            bossAvatar.classList.remove('boss-hit');
            void bossAvatar.offsetWidth;
            bossAvatar.classList.add('boss-hit');

            monsterHP = Math.max(0, monsterHP - damage);
            updateArenaHP();

            if (monsterHP <= 0) {
                bossAvatar.innerText = '💀';
                setTimeout(() => {
                    appendOutput("☠️ BOOMMM! CYBER MONSTER HANCUR LEBUR!", "success");
                    appendOutput("🏆 PASUKAN PIXEL MENANG! Hadiah Vault terbuka...", "cyan");
                    playBeep(1200, 'sawtooth', 0.3);
                    setTimeout(() => {
                        document.getElementById('secretVault').style.display = 'flex';
                    }, 400);
                }, 300);
            }
        }

        function handleCommand(cmd) {
            if (!cmd) return;

            if (cmd === '1') cmd = 'pasukan';
            if (cmd === '2') cmd = 'api';
            if (cmd === '3') cmd = 'listrik';
            if (cmd === '4') cmd = 'serang';

            switch(cmd) {
                case 'help':
                    appendOutput("--- PERINTAH TERSEDIA ---", "cyan");
                    appendOutput("Pencet tombol di bawah layar HP-mu:", "system");
                    appendOutput("<b>1</b> / pasukan : Panggil Pasukan Pixel 👾", "cyan");
                    appendOutput("<b>2</b> / api     : Skill Bola Api 🔥 (-35 HP)", "fire");
                    appendOutput("<b>3</b> / listrik : Skill Petir Cyber ⚡ (-45 HP)", "zap");
                    appendOutput("<b>4</b> / serang  : Pukulan Pasukan (-20 HP)", "success");
                    appendOutput("<b>monster</b>    : Memanggil Boss Monster", "monster");
                    appendOutput("<b>clear</b>      : Bersihkan layar", "system");
                    break;

                case 'monster':
                case 'boss':
                    monsterHP = 100;
                    playMonsterRoar();
                    appendOutput("👹 CYBER BOSS DIPANGGIL KE ARENA!", "error");
                    renderArenaBox();
                    break;

                case 'pasukan':
                    hasArmy = true;
                    playBeep(900, 'triangle', 0.08);
                    if (!activeArenaEl || monsterHP <= 0) {
                        renderArenaBox();
                    } else {
                        const armyAvatar = document.getElementById('armyAvatar');
                        const armyStatus = document.getElementById('armyStatusText');
                        if (armyAvatar) {
                            armyAvatar.innerText = '👾 👾 👾';
                            armyAvatar.className = 'army-avatar army-idle';
                        }
                        if (armyStatus) {
                            armyStatus.innerText = 'Battle Ready!';
                            armyStatus.style.color = '#00ff66';
                        }
                    }
                    appendOutput("👾👾👾 PASUKAN PIXEL HADIR & SIAP BERTARUNG!", "cyan");
                    break;

                case 'api':
                    if (monsterHP <= 0 || !activeArenaEl) {
                        appendOutput("❌ Monster belum dipanggil! Pencet tombol <b style='color:#ff0055;'>👹 Boss</b> dulu.", "warning");
                        break;
                    }
                    playFireSound();
                    
                    const track1 = document.getElementById('middleTrack');
                    if (track1) {
                        const fireProj = document.createElement('span');
                        fireProj.className = 'projectile-fire';
                        fireProj.innerText = '🔥🔥';
                        track1.appendChild(fireProj);

                        setTimeout(() => {
                            fireProj.remove();
                            triggerBossHitEffect(35);
                        }, 400);
                    }
                    break;

                case 'listrik':
                    if (monsterHP <= 0 || !activeArenaEl) {
                        appendOutput("❌ Monster belum dipanggil! Pencet tombol <b style='color:#ff0055;'>👹 Boss</b> dulu.", "warning");
                        break;
                    }
                    playZapSound();

                    const track2 = document.getElementById('middleTrack');
                    if (track2) {
                        const zapProj = document.createElement('span');
                        zapProj.className = 'projectile-zap';
                        zapProj.innerText = '⚡⚡';
                        track2.appendChild(zapProj);

                        setTimeout(() => {
                            zapProj.remove();
                            triggerBossHitEffect(45);
                        }, 320);
                    }
                    break;

                case 'serang':
                    if (!hasArmy) {
                        appendOutput("⚠️ Panggil <b style='color:#00f0ff;'>Pasukan (1)</b> terlebih dahulu!", "warning");
                        break;
                    }
                    if (monsterHP <= 0 || !activeArenaEl) {
                        appendOutput("❌ Monster belum dipanggil! Pencet tombol <b style='color:#ff0055;'>👹 Boss</b> dulu.", "warning");
                        break;
                    }
                    playBeep(700, 'square', 0.08);

                    const armyAvatar = document.getElementById('armyAvatar');
                    if (armyAvatar) {
                        armyAvatar.classList.remove('army-idle');
                        armyAvatar.classList.add('army-dash');

                        setTimeout(() => {
                            triggerBossHitEffect(20);
                        }, 200);

                        setTimeout(() => {
                            armyAvatar.classList.remove('army-dash');
                            armyAvatar.classList.add('army-idle');
                        }, 400);
                    }
                    break;

                case 'clear':
                    terminalBody.innerHTML = '';
                    activeArenaEl = null;
                    break;

                default:
                    appendOutput(`Perintah '${cmd}' tidak dikenal. Ketik <b>help</b>.`, "error");
                    break;
            }

            cmdInput.value = '';
        }

        cmdInput.addEventListener('keydown', function(e) {
            initAudio();
            if (e.key === 'Enter') {
                const command = this.value.trim().toLowerCase();
                handleCommand(command);
            }
        });

        function closeVault() {
            document.getElementById('secretVault').style.display = 'none';
        }

        window.onload = () => {
            setTimeout(typeBootSequence, 150);
        };
    </script>
</body>
</html>
